<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Simulator — AlertCitizen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif}
.phone{background:#1a1a2e;border-radius:24px;width:100%;max-width:360px;height:640px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.statusbar{padding:8px 16px;display:flex;justify-content:space-between;font-size:12px;color:#aaa;border-bottom:1px solid #2a2a3e}
.reset{position:absolute;top:40px;right:16px;font-size:10px;color:#666;cursor:pointer;background:none;border:none}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg-user{align-self:flex-end;background:#075e54;color:#fff;border-radius:12px 12px 2px 12px;padding:10px 14px;max-width:80%;font-size:15px;line-height:1.4;overflow-wrap:break-word}
.msg-system{align-self:flex-start;background:#fff;color:#212121;border-radius:12px 12px 12px 2px;padding:10px 14px;max-width:80%;font-size:15px;line-height:1.4;overflow-wrap:break-word}
.msg-system a{color:#0D47A1;text-decoration:underline}
.timestamp{font-size:10px;color:#888;margin-top:4px;text-align:right}
.inputbar{padding:12px 16px;display:flex;gap:8px;align-items:center;border-top:1px solid #2a2a3e}
#sms-input{flex:1;height:44px;border-radius:20px;border:1px solid #444;background:#2a2a3e;color:#fff;padding:0 16px;font-size:16px;outline:none}
#send{width:44px;height:44px;border-radius:50%;background:#075e54;border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.note{text-align:center;font-size:10px;color:#666;padding:0 16px 10px}
</style>
</head>
<body>
<div class="phone">
<div class="statusbar"><span>MTN</span><span>10:42 &#128267;</span></div>
<button class="reset" id="reset" type="button">RESET</button>
<div id="messages" aria-live="polite"></div>
<div class="inputbar">
<input id="sms-input" type="text" placeholder="Type your message..." autocomplete="off" aria-label="Type your message">
<button id="send" type="button" aria-label="Send">&#10148;</button>
</div>
<div class="note">Simulator. No real SMS is sent.</div>
</div>
<script>
var MANDATE_URL = "http://YOUR-LAPTOP-IP:3000";
var TOLL_FREE = "0800-225-8424";
// Phrase lists mirror data/sms-phrases.json (single source of truth — keep
// in sync by hand; this file must also work opened straight from disk).
// Served over http(s), the link targets this same device automatically so it
// always routes to the local homepage; from file:// it uses MANDATE_URL.
var BASE_URL = (location.protocol.indexOf("http") === 0) ? location.origin : MANDATE_URL;
var LANGUAGE_MAP = {
en: ["I NEED HELP", "HELP", "I NEED ASSISTANCE", "NEED HELP", "HELP ME", "PLEASE HELP", "EMERGENCY", "ASSISTANCE"],
lg: ["NSOLA", "NTEEGAMWA", "NSOLA BYAMASO", "NTEEGAMWA BYAMASO", "NETAAGA", "OBUYAMBI", "BUYAMBI", "NNEETA OBUYAMBI", "NNEETA OKUYAMBIBWA", "MPA OBUYAMBI", "YAMBA"],
sw: ["NITAHITAJA MSAADA", "MSAADA", "NITAHITAJA", "NAHITAJI MSAADA", "NINAHITAJI MSAADA", "NINAHITAJI USAIDIZI", "NISAIDIE", "SAIDIA"]
};
function detectLanguage(text) {
var n = String(text || "").toUpperCase().trim();
for (var lang in LANGUAGE_MAP) {
var phrases = LANGUAGE_MAP[lang];
for (var i = 0; i < phrases.length; i++) {
if (n.indexOf(phrases[i]) !== -1) return lang;
}
}
return "en";
}
function buildResponse(lang) {
var R = {
en: "Hello! Welcome to AlertCitizen.\n\nTap this link to get started:\n" + BASE_URL + "?lang=en\n\nNo data? Call toll-free: " + TOLL_FREE + "\n\nWe are here to help you with:\n- Public services\n- Local council info\n- Fees & permits\n- Land disputes\n- Safety & protection\n\nInformation you can trust.",
lg: "Teegeka! Wakulinda mu AlertCitizen.\n\nKolaaki ku linkino eyo okutandika:\n" + BASE_URL + "?lang=lg\n\nOsi na data? Sooka: " + TOLL_FREE + "\n\nTukuyambako ku:\n- Emirimu gy'abantu bonna\n- Omukulembeze wo mu kibuga\n- Omutindo n'ebitegeeza\n- Emisaasaana y'ensi\n- Obulamu n'obukuumi\n\nEbikwata by'okusobola okwetegeka.",
sw: "Karibu! Karibu kwenye AlertCitizen.\n\nBonyeza hii link ili uanze:\n" + BASE_URL + "?lang=sw\n\nHuna data? Piga bure: " + TOLL_FREE + "\n\nTutakusaidia na:\n- Huduma za umma\n- Taarifa za mamliko\n- Ada na vyeti\n- Migogoro ya nchi\n- Usalama na ulinzi\n\nTaarifa unaweza kuamini."
};
return R[lang] || R.en;
}
function esc(s) {
return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function linkify(s) {
return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1">$1</a>');
}
function stamp() {
return new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
}
function addMessage(text, isUser) {
var area = document.getElementById("messages");
var b = document.createElement("div");
b.className = isUser ? "msg-user" : "msg-system";
var html = esc(text).replace(/\n/g, "<br>");
if (!isUser) html = linkify(html);
b.innerHTML = html + '<div class="timestamp">' + stamp() + "</div>";
area.appendChild(b);
area.scrollTop = area.scrollHeight;
}
function handleSend() {
var input = document.getElementById("sms-input");
var text = input.value.trim();
if (!text) return;
addMessage(text, true);
input.value = "";
setTimeout(function () {
addMessage(buildResponse(detectLanguage(text)), false);
}, 1500);
}
document.getElementById("send").addEventListener("click", handleSend);
document.getElementById("sms-input").addEventListener("keydown", function (e) {
if (e.key === "Enter") handleSend();
});
document.getElementById("reset").addEventListener("click", function () {
document.getElementById("messages").innerHTML = "";
location.reload();
});
</script>
</body>
</html>
