<!-- AUTHOR NOTE: convert this SVG to PNGs for the PWA manifest:
     icons/icon-192.png (192x192) and icons/icon-512.png (512x512).
     Example (no Node native deps needed, uses macOS sips or any SVG→PNG tool):
       sips -s format png -z 192 192 public/icons/shield.svg --out public/icons/icon-192.png
       sips -s format png -z 512 512 public/icons/shield.svg --out public/icons/icon-512.png
